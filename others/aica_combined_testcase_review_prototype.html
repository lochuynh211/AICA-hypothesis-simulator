<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICA Combined Simulator — Experience Test Case Review (prototype)</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   AICA Combined Simulator · Experience Test Case Review — STANDALONE PROTOTYPE
   Refines the built Combined screen around
   docs/superpowers/specs/2026-07-24-combined-test-case-evaluation-design.md
   Self-contained: no network, no external fonts, no Maps key.
   Numbers are computed in-page from the SAME chains the real evidence records.
   ══════════════════════════════════════════════════════════════════════════ */

:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1e293b; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e2e8f0; --line-2:#cbd5e1;
  --chrome:#0f0f1e; --chrome-2:#1c1c35; --accent:#2563eb; --accent-soft:#eff4ff;
  --match:#0f766e; --match-bg:#ecfdf5; --match-line:#5eead4;
  --partial:#b45309; --partial-bg:#fffbeb; --partial-line:#fcd34d;
  --miss:#b91c1c; --miss-bg:#fef2f2; --miss-line:#fca5a5;
  --none:#64748b; --none-bg:#f1f5f9; --none-line:#cbd5e1;
  --unver:#6d28d9; --unver-bg:#f5f3ff; --unver-line:#c4b5fd;
  --support:#0d9488; --oppose:#dc2626;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul{padding-left:1.05em}

/* ── Header ─────────────────────────────────────────────────────────────── */
header{
  flex:0 0 auto;background:var(--chrome);color:#e2e8f0;
  display:flex;align-items:center;gap:14px;padding:7px 14px;border-bottom:1px solid #2a2a4a;
}
.brand{font-weight:800;font-size:.9em;letter-spacing:.02em;white-space:nowrap}
.brand span{color:#7dd3fc;font-weight:600}
.screen-tabs{display:flex;gap:3px;margin-left:4px}
.screen-tabs button{
  padding:3px 11px;font-size:.76em;border-radius:4px;border:1px solid transparent;
  background:transparent;color:#94a3b8;
}
.screen-tabs button.on{background:var(--accent);border-color:#1d4ed8;color:#fff;font-weight:700}
.hspacer{flex:1}
.mode-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:.72em;font-weight:700;
  padding:3px 10px;border-radius:999px;border:1px solid;letter-spacing:.02em;
}
.mode-badge.official{background:#062f2b;border-color:#0f766e;color:#5eead4}
.mode-badge.adhoc{background:#3b2508;border-color:#b45309;color:#fcd34d}
.ver{font-size:.68em;color:#64748b;font-family:var(--mono);white-space:nowrap}
.lang-toggle{display:flex;border:1px solid #334155;border-radius:5px;overflow:hidden}
.lang-toggle button{padding:2px 9px;font-size:.72em;background:transparent;color:#94a3b8;border:0;font-weight:600}
.lang-toggle button.on{background:#334155;color:#fff}

/* ── 3-panel grid ───────────────────────────────────────────────────────── */
main{flex:1;min-height:0;display:grid;grid-template-columns:20% 45% 35%;gap:1px;background:var(--line-2)}
.col{background:var(--bg);min-height:0;overflow-y:auto;padding:10px}
.col::-webkit-scrollbar{width:9px}
.col::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:9px}
.card.flush{padding:0;overflow:hidden}
.card-h{
  font-size:.68em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--accent);margin-bottom:7px;display:flex;align-items:center;gap:7px;
}
.card-h .sub{color:var(--ink-3);font-weight:600;letter-spacing:0;text-transform:none;font-size:1.02em}
.card-h .hspacer{flex:1}

/* ── LEFT: catalog ──────────────────────────────────────────────────────── */
.cat-group{font-size:.66em;font-weight:800;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);padding:8px 11px 3px}
.case-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 11px;background:transparent;border:0;border-left:3px solid transparent;
  color:var(--ink);font-size:.84em;
}
.case-row:hover{background:var(--accent-soft)}
.case-row.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:700}
.case-row .code{font-family:var(--mono);font-size:.86em;color:var(--ink-2);flex:0 0 44px}
.case-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{
  display:inline-flex;align-items:center;gap:3px;font-size:.64em;font-weight:800;
  padding:1px 7px;border-radius:999px;border:1px solid;letter-spacing:.03em;white-space:nowrap;
}
.pill.MATCH{color:var(--match);background:var(--match-bg);border-color:var(--match-line)}
.pill.PARTIAL_MATCH{color:var(--partial);background:var(--partial-bg);border-color:var(--partial-line)}
.pill.MISMATCH{color:var(--miss);background:var(--miss-bg);border-color:var(--miss-line)}
.pill.NOT_EVALUATED{color:var(--none);background:var(--none-bg);border-color:var(--none-line)}
.pill.UNVERIFIABLE{color:var(--unver);background:var(--unver-bg);border-color:var(--unver-line)}
.pill.EXECUTION_ERROR{color:#fff;background:#991b1b;border-color:#7f1d1d}
.pill.PENDING{color:var(--ink-3);background:#f8fafc;border-color:var(--line)}
.pair-tag{font-size:.62em;font-weight:800;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;
  border-radius:4px;padding:0 4px}

/* case card */
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 9px;font-size:.8em}
.kv dt{color:var(--ink-3);font-weight:700;font-size:.9em;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.kv dd{margin:0;color:var(--ink)}
.narr{font-size:.83em;color:var(--ink-2);line-height:1.6}
.sec-l{font-size:.68em;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  margin:9px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.72em;background:#f1f5f9;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--ink-2)}
.brief{font-size:.82em;line-height:1.6;color:var(--ink);margin-top:6px}
.chip.focus{background:var(--accent-soft);border-color:#bfdbfe;color:#1d4ed8;font-weight:600}
.chip.pos{background:var(--match-bg);border-color:var(--match-line);color:var(--match)}
.chip.neg{background:var(--miss-bg);border-color:var(--miss-line);color:var(--miss)}
.tiny{font-size:.72em;color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:.9em}
.locked{
  display:flex;align-items:center;gap:6px;font-size:.72em;color:var(--ink-2);
  background:#f8fafc;border:1px dashed var(--line-2);border-radius:6px;padding:5px 8px;margin-top:7px
}
.btn{
  font-size:.76em;font-weight:600;padding:4px 10px;border-radius:6px;
  border:1px solid var(--line-2);background:#fff;color:var(--ink-2)
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:#1d4ed8;color:#fff}
.btn.primary:hover{background:#1d4ed8;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:#fcd34d;background:var(--partial-bg);color:var(--partial)}

/* ── CENTER: simulation ─────────────────────────────────────────────────── */
.strip-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.strip-h .t{font-size:.7em;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.strip-h .hint{font-size:.7em;color:var(--ink-3)}
svg.tl{display:block;width:100%;height:auto;background:#fff;border-radius:7px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:.68em;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:11px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:9px 0}
.controls .clock{font-family:var(--mono);font-size:.78em;color:var(--ink-2);background:#fff;
  border:1px solid var(--line);border-radius:6px;padding:3px 9px}
select{font:inherit;font-size:.78em;padding:2px 5px;border:1px solid var(--line-2);border-radius:5px;background:#fff}
.ck-rail{display:flex;flex-direction:column;gap:4px;margin-top:7px}
.ck{
  display:flex;align-items:center;gap:8px;font-size:.76em;padding:4px 8px;border-radius:6px;
  border:1px solid var(--line);background:#fff;width:100%;text-align:left;color:var(--ink)
}
.ck:hover{border-color:var(--accent)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck .at{font-family:var(--mono);font-size:.86em;color:var(--ink-3);flex:0 0 52px}
.ck .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.map{display:block;width:100%;height:auto;background:#f8fafc;border-radius:7px;border:1px solid var(--line)}

/* ── RIGHT: verdict ─────────────────────────────────────────────────────── */
.verdict-rows{display:flex;flex-direction:column}
.vrow{
  display:flex;align-items:center;gap:9px;padding:6px 11px;background:transparent;border:0;
  border-top:1px solid var(--line);width:100%;text-align:left;font-size:.82em;color:var(--ink)
}
.vrow:first-child{border-top:0}
.vrow:hover{background:var(--accent-soft)}
.vrow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.vrow .stg{flex:0 0 96px;font-weight:700}
.vrow .dt{flex:1;min-width:0;font-size:.9em;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .car{color:var(--ink-3);font-size:.9em}
.vrow.overall{background:#f8fafc;border-top:2px solid var(--line-2)}
.vrow.overall .stg{font-weight:800;text-transform:uppercase;font-size:.92em;letter-spacing:.04em}
.divergence{
  font-size:.76em;border-radius:7px;padding:7px 9px;margin-top:8px;
  background:var(--miss-bg);border:1px solid var(--miss-line);color:#7f1d1d
}
.divergence.ok{background:var(--match-bg);border-color:var(--match-line);color:#115e59}
.divergence b{display:block;font-size:.94em;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.flow{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.9em;margin-top:4px;flex-wrap:wrap}
.flow span{padding:1px 6px;border-radius:4px;background:#fff;border:1px solid var(--line-2);color:var(--ink-3)}
.flow span.hit{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:800}
.flow span.pass{background:var(--match-bg);border-color:var(--match-line);color:var(--match)}

/* expected | actual comparison */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cmp>div{padding:8px 9px;min-width:0}
.cmp>div:first-child{background:#fbfcfe;border-right:1px solid var(--line)}
.cmp-h{font-size:.66em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.cmp-h.exp{color:var(--ink-3)} .cmp-h.act{color:var(--accent)}
.outv{font-size:.86em;font-weight:700;word-break:break-word}
.outv.bad{color:var(--miss)} .outv.good{color:var(--match)}

/* factor bars */
.fbar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:.76em;margin-bottom:3px}
.fbar .nm{display:flex;align-items:center;gap:5px;min-width:0}
.fbar .nm code{font-family:var(--mono);font-size:.88em;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar .rk{font-size:.68em;font-weight:800;color:#fff;background:var(--ink-3);border-radius:3px;padding:0 4px;flex:0 0 auto}
.fbar .rk.top{background:var(--accent)}
.fbar .val{font-family:var(--mono);font-size:.84em;text-align:right;white-space:nowrap}
.fbar .track{grid-column:1/3;height:5px;background:#f1f5f9;border-radius:3px;position:relative;overflow:hidden;margin-bottom:2px}
.fbar .fill{position:absolute;top:0;bottom:0;border-radius:3px}
.fill.sup{background:var(--support)} .fill.opp{background:var(--oppose)}
.fbar.flag .nm code{color:var(--miss);font-weight:700}
.fbar.flag{background:var(--miss-bg);border-radius:4px;padding:2px 4px;margin:0 -4px 3px}

/* gates / alternatives */
.gate{font-size:.75em;border-left:3px solid var(--line-2);padding:3px 0 3px 8px;margin-bottom:5px}
.gate.pass{border-left-color:var(--match)} .gate.block{border-left-color:var(--miss)}
.gate .g-id{font-family:var(--mono);font-size:.88em;font-weight:700}
.gate .g-rule{color:var(--ink-2)}
.alt{display:flex;align-items:center;gap:7px;font-size:.76em;padding:3px 0}
.alt .d{font-family:var(--mono);font-size:.86em;color:var(--partial);font-weight:700}

/* service / content output */
.cand{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;overflow:hidden;background:#fff}
.cand.win{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
.cand-h{display:flex;align-items:center;gap:8px;padding:6px 9px;background:#fbfcfe;width:100%;
  border:0;border-bottom:1px solid var(--line);text-align:left;font-size:.82em;color:var(--ink)}
.cand-h:hover{background:var(--accent-soft)}
.cand-h .rank{font-size:.7em;font-weight:800;color:#fff;background:var(--ink-3);border-radius:4px;padding:1px 6px}
.cand.win .cand-h .rank{background:var(--accent)}
.cand-h .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-h .sc{font-family:var(--mono);font-size:.86em;font-weight:700}
.cand-b{padding:7px 9px;border-top:1px solid var(--line);display:none}
.cand-b.open{display:block}
.rationale{font-size:.76em;color:var(--ink-2);font-style:italic;margin-bottom:6px}
table.chain{width:100%;border-collapse:collapse;font-size:.7em;font-family:var(--mono)}
table.chain th{text-align:right;color:var(--ink-3);font-weight:700;padding:2px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.chain th:first-child{text-align:left}
table.chain td{text-align:right;padding:2px 4px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
table.chain td:first-child{text-align:left;color:var(--ink-2)}
table.chain td.c-sup{color:var(--support);font-weight:700}
table.chain td.c-opp{color:var(--oppose);font-weight:700}
table.chain tr.flag td{background:var(--miss-bg)}
.excl{font-size:.74em;color:var(--ink-2);display:flex;align-items:center;gap:6px;padding:2px 0}
.excl code{font-family:var(--mono);font-size:.88em}
.excl .why{color:var(--miss);font-size:.9em}
.item{border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fff;overflow:hidden}
.item-h{display:flex;align-items:center;gap:8px;padding:5px 9px;width:100%;border:0;background:#fff;
  text-align:left;font-size:.8em;color:var(--ink)}
.item-h:hover{background:var(--accent-soft)}
.item-h .pos{font-family:var(--mono);font-size:.8em;color:var(--ink-3);flex:0 0 16px}
.item-h .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.item-h .ar{color:var(--ink-3);font-size:.86em;flex:0 0 auto;max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-h .fit{font-family:var(--mono);font-size:.86em;font-weight:700;color:var(--accent)}
.traits{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.trait{font-size:.68em;font-family:var(--mono);background:#f1f5f9;border-radius:4px;padding:0 5px;color:var(--ink-2)}
.trait.hi{background:#fef3c7;color:#92400e}
.plan-meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}

/* contrast */
.delta-tbl{width:100%;border-collapse:collapse;font-size:.76em}
.delta-tbl th{text-align:left;font-size:.86em;color:var(--ink-3);font-weight:700;padding:3px 5px;border-bottom:1px solid var(--line)}
.delta-tbl td{padding:4px 5px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.delta-tbl td.v{font-family:var(--mono);font-size:.9em}
.arrow{color:var(--ink-3);padding:0 3px}
.mat{font-weight:800;color:var(--accent)}
.pairbar{display:flex;gap:4px;margin-bottom:7px}
.pairbar button{flex:1;font-size:.76em;padding:4px;border-radius:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2)}
.pairbar button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}

.adhoc-veil{
  background:var(--partial-bg);border:1px solid var(--partial-line);border-radius:8px;
  padding:9px 11px;font-size:.78em;color:#78350f;margin-bottom:9px
}
.adhoc-veil b{display:block;margin-bottom:3px}

/* modal — copied from app.css (.modal-backdrop / .modal-card / --wide) */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,15,30,.55);display:none;
  align-items:center;justify-content:center;z-index:1000}
.modal-backdrop.open{display:flex}
.modal-card{background:#fff;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.35);
  max-width:min(520px,92vw);max-height:85vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-card--wide{max-width:min(920px,94vw);width:920px}
.modal-card .modal-header{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 16px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:2}
.modal-card .modal-header h3{font-size:1rem;font-weight:700;color:#1a1a1a}
.modal-card .modal-body{padding:14px 16px}
.modal-close{border:none;background:transparent;font-size:1.1rem;line-height:1;padding:2px 6px;color:#6b7280;cursor:pointer}
.modal-close:hover{background:#f3f4f6;color:#1a1a1a}
.modal .row,.modal-card .row{display:flex;align-items:center;gap:8px;font-size:.82em;padding:5px 0;border-bottom:1px solid var(--line)}
.modal-card .row .k{flex:0 0 190px;font-family:var(--mono);font-size:.86em;color:var(--ink-2)}
.modal-card .row input{flex:1;font:inherit;font-size:.94em;padding:3px 6px;border:1px solid var(--line-2);border-radius:5px}
.modal-card .row.hprow .k{flex:0 0 190px;line-height:1.3}
.modal-card .row.hprow .k b{font-family:inherit;font-size:1.02em;color:var(--ink)}
.modal-card .row.hprow .k code{font-size:.85em;color:var(--ink-3)}

/* matrixStyles.ts — table.mtx, shared by every matrix/table editor */
table.mtx{border-collapse:collapse;width:100%;font-size:.76em;margin:4px 0}
table.mtx th{border:1px solid #e5e7eb;padding:3px 6px;text-align:center;white-space:nowrap;
  background:#f1f5f9;font-weight:700;color:#4b5563}
table.mtx td{border:1px solid #e5e7eb;padding:3px 6px;text-align:center;white-space:nowrap}
table.mtx th.rowlab{text-align:left;background:#f8fafc;font-weight:600;color:#4b5563}
table.mtx th.corner{background:#f8fafc;text-align:left}
table.mtx input{width:52px;text-align:center;padding:1px 3px;border:1px solid transparent;
  background:transparent;border-radius:4px;font:inherit;font-size:1em}
table.mtx input:focus{border-color:var(--line-2);background:#fff;outline:none}
table.mtx input.scalar{width:76px;border:1px solid #e5e7eb;background:#fff}
table.mtx code{color:#9ca3af;font-weight:400}

/* signalPrimitives.tsx — SignalGroup / SignalRow */
.sgroup{margin-top:12px}
.sgroup h3{font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;margin:0 0 4px}
.sgroup .caption{font-size:.7em;color:#9ca3af;margin:0 0 6px;line-height:1.4}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 4px;
  margin-bottom:2px;border-radius:4px;font-size:.8em}
.srow>span:first-child{color:#374151}
.srow .sval{display:flex;align-items:center;gap:4px}
.srow .sval span{color:#374151}
.srow.muted>span:first-child,.srow.muted .sval span{color:#9ca3af;font-style:italic}
.srow input[type=number]{width:74px;font:inherit;font-size:.94em;padding:1px 4px;border:1px solid var(--line-2);border-radius:4px;text-align:right}
.srow input[type=range]{width:110px}
.nested{margin:4px 0 4px 2px;padding-left:8px;border-left:2px solid #e5e7eb}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PART 1 — evidence math.
   These are the SAME chains the real evidence records, so every number shown
   in this prototype is derived, not typed in:

     service  effective_weight = normalize(base_weight × purpose_multiplier)
              normalized_feature_response = normalized_evidence × response_coefficient
              contribution = normalized_feature_response × effective_weight
              score = Σ contribution
     content  r_i = e_i × a_i ;  contribution = r_i × effective_weight
              item_fit = Σ contribution
     trigger  smoothed = EWMA(normalized_evidence, α) ;  contribution = smoothed × effective_weight
              category_score = Σ contribution        (proposed additive trace, §10.4)
   ═══════════════════════════════════════════════════════════════════════════ */
let LANG = 'ja';
const S = (ja, en) => ({ ja, en });
const T = (o) => (o && typeof o === 'object' && 'ja' in o ? (o[LANG] || o.en) : o);
const f3 = (n) => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(3);
const f2 = (n) => n.toFixed(2);
const pct = (n) => (n * 100).toFixed(1) + '%';

function normWeights(rows) {
  const raw = rows.map((r) => (r.mask === 0 ? 0 : r.bw * (r.pm ?? 1)));
  const s = raw.reduce((a, b) => a + b, 0) || 1;
  return raw.map((v) => v / s);
}
/** rows: {id, raw, ne (normalized evidence), sm (smoothed), bw, pm, note?} */
function triggerFactors(rows) {
  const w = normWeights(rows);
  return rows.map((r, i) => ({ ...r, stage: 'trigger', ew: w[i], contrib: r.sm * w[i] }));
}
/** rows: {id, raw, ne, rc (response coefficient), bw, pm, src?} */
function serviceFactors(rows) {
  const w = normWeights(rows);
  return rows.map((r, i) => ({ ...r, stage: 'service', nr: r.ne * r.rc, ew: w[i], contrib: r.ne * r.rc * w[i] }));
}
/** rows: {id, e (evidence), a (affinity), bw, pm} */
function contentFactors(rows) {
  const w = normWeights(rows);
  return rows.map((r, i) => ({ ...r, stage: 'content', ri: r.e * r.a, ew: w[i], contrib: r.e * r.a * w[i] }));
}
const sumC = (fs) => fs.reduce((a, f) => a + f.contrib, 0);
const byAbs = (fs) => [...fs].sort((a, b) => Math.abs(b.contrib) - Math.abs(a.contrib));
const top3 = (fs) => byAbs(fs).slice(0, 3).map((f) => f.id);
const rankOf = (fs, id) => byAbs(fs).findIndex((f) => f.id === id) + 1;
const dirOf = (fs, id) => { const f = fs.find((x) => x.id === id); return !f ? null : f.contrib > 1e-9 ? 'supporting' : f.contrib < -1e-9 ? 'opposing' : 'neutral'; };

/* ═══════════════════════════════════════════════════════════════════════════
   PART 2 — vocabulary (feature ids, services, catalog tracks).
   Feature ids and service ids are the real ones; tracks are the real
   soundcharts-grounded-spotify-compatible-demonstration-seed-1042 catalog.
   ═══════════════════════════════════════════════════════════════════════════ */
const FEAT = {
  drowsiness: S('眠気', 'drowsiness'),
  fatigue: S('疲労', 'fatigue'),
  driving_time: S('連続運転時間', 'continuous driving time'),
  monotony: S('単調さ', 'monotony'),
  rest_window: S('休憩機会の窓', 'rest window'),
  rest_scarcity: S('休憩地の希少性', 'rest scarcity'),
  driving_anomaly: S('運転挙動の乱れ', 'driving anomaly'),
  env_load: S('環境負荷', 'environmental load'),
  familiar_route: S('慣れた道', 'familiar route'),
  drowsiness_level: S('眠気レベル', 'drowsiness level'),
  fatigue_level: S('疲労レベル', 'fatigue level'),
  monotony_level: S('単調さレベル', 'monotony level'),
  traffic_state: S('交通状況', 'traffic state'),
  road_type: S('道路種別', 'road type'),
  night_state: S('昼夜', 'night state'),
  motion_state: S('走行/停車', 'motion state'),
  song_singability: S('歌いやすさ', 'song singability'),
  oshi_id: S('推し', 'oshi'),
  played_items: S('直近再生履歴', 'recent play history'),
  skipped_items: S('スキップ履歴', 'skip history'),
  catalog_item_usage_level: S('曲の利用度', 'item usage level'),
  content_recovery_rate: S('コンテンツ回復率', 'content recovery rate'),
  service_usage_level: S('サービス利用度', 'service usage level'),
  service_recency_state: S('サービス直近度', 'service recency'),
  age_band: S('年代', 'age band'),
  child_present: S('子ども同乗', 'child present'),
};
const FL = (id) => T(FEAT[id] || S(id, id));

/* Plain phrasing for reviewers who know the domain but not the model.
   These read as sentence fragments: "<phrase> decided it". */
const PHRASE = {
  drowsiness_level: S('運転者の眠気', 'how sleepy the driver is'),
  fatigue_level: S('運転者の疲れ', 'how tired the driver is'),
  monotony_level: S('道の単調さ', 'how monotonous the road is'),
  driving_time: S('休憩なしの連続運転時間', 'how long they have driven without a break'),
  rest_window: S('休憩できる場所の近さ', 'how soon a rest spot is available'),
  rest_scarcity: S('休憩できる場所の少なさ', 'how few rest spots there are'),
  driving_anomaly: S('運転の乱れ', 'unsteady driving'),
  env_load: S('道路と環境の負荷', 'how demanding the road and conditions are'),
  familiar_route: S('道の走り慣れ', 'how familiar the road is'),
  traffic_state: S('渋滞の状況', 'the traffic'),
  road_type: S('道路の種類', 'the kind of road'),
  night_state: S('夜であること', 'that it is night'),
  motion_state: S('走行中か停車中か', 'whether the car is moving or stopped'),
  service_usage_level: S('このサービスの利用頻度', 'how often they use this service'),
  service_recency_state: S('最近使ったかどうか', 'how recently they used it'),
  oshi_id: S('登録した推し', 'their registered favourite artist'),
  content_recovery_rate: S('回復への効きやすさ', 'how well this helps them recover'),

/* ═══════════════════════════════════════════════════════════════════════════
   PART 6 — the centre column: quickview timeline, checkpoint rail, route.
   ═══════════════════════════════════════════════════════════════════════════ */
const ROAD_COLOR = { urban: '#cbd5e1', highway: '#93c5fd', normal_road: '#a7f3d0', mountain: '#fcd34d' };
const ROAD_LABEL = { urban: S('市街地', 'urban'), highway: S('高速', 'highway'), normal_road: S('一般道', 'ordinary'), mountain: S('山岳路', 'mountain') };
const ROUTE_PATH = {
  long_tokyo_osaka: 'M 34 196 C 96 188, 128 148, 190 143 S 268 163, 316 128 S 404 58, 474 68 S 562 52, 592 36',
  middle_tokyo_karuizawa: 'M 34 208 C 84 198, 114 168, 164 173 S 244 198, 302 158 S 362 88, 432 108 S 542 88, 592 46',
  short_tokyo_chichibu: 'M 34 188 C 104 183, 144 208, 204 188 S 302 128, 362 148 S 472 118, 592 78',
};
const X0 = 32, X1 = 604, YT = 24, YB = 150;
const px = (f) => X0 + f * (X1 - X0);
const py = (v) => YB - Math.max(0, Math.min(1, v)) * (YB - YT);

/** Linear interpolation over [frac, value] control points → SVG polyline points. */
function curvePts(pts, n = 180) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    let a = pts[0], b = pts[pts.length - 1];
    for (let k = 0; k < pts.length - 1; k++) if (f >= pts[k][0] && f <= pts[k + 1][0]) { a = pts[k]; b = pts[k + 1]; break; }
    const t = b[0] === a[0] ? 0 : (f - a[0]) / (b[0] - a[0]);
    out.push(px(f).toFixed(1) + ',' + py(a[1] + (b[1] - a[1]) * t).toFixed(1));
  }
  return out.join(' ');
}

function renderTimeline() {
  const c = cur(), s = c.sim, D = s.durationMin;
  let g = '';
  /* road-type band + jam sub-bar */
  g += s.segments.map(([a, b, t]) => `<rect x="${px(a)}" y="6" width="${px(b) - px(a)}" height="8" fill="${ROAD_COLOR[t] || '#e2e8f0'}"/>`).join('');
  g += s.jams.map(([a, b]) => `<rect x="${px(a)}" y="15" width="${px(b) - px(a)}" height="5" fill="#fca5a5"/>`).join('');
  /* expected window band */
  if (s.expectedWindow) {
    const a = px(s.expectedWindow.fromMin / D), b = px(s.expectedWindow.toMin / D);
    g += `<rect x="${a}" y="${YT}" width="${b - a}" height="${YB - YT}" fill="#fbbf24" opacity=".14"/>
          <line x1="${a}" y1="${YT}" x2="${a}" y2="${YB}" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2"/>
          <line x1="${b}" y1="${YT}" x2="${b}" y2="${YB}" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2"/>
          <text x="${(a + b) / 2}" y="${YT - 3}" font-size="8" fill="#b45309" text-anchor="middle" font-weight="700">${esc(T(s.expectedWindow.label))}</text>`;
  }
  /* frame + threshold */
  g += `<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" stroke="#cbd5e1"/>`;
  g += `<line x1="${X0}" y1="${py(.7)}" x2="${X1}" y2="${py(.7)}" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
        <text x="${X1 + 2}" y="${py(.7) + 3}" font-size="7.5" fill="#ef4444">0.70</text>`;
  /* curves */
  g += `<polyline points="${curvePts(s.rest)}" fill="none" stroke="#2563eb" stroke-width="2"/>`;
  g += `<polyline points="${curvePts(s.mono)}" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3"/>`;
  /* rest spots */
  g += s.rests.map((r) => `<g><line x1="${px(r.frac)}" y1="${YT}" x2="${px(r.frac)}" y2="${YB}" stroke="#14b8a6" stroke-width="1" opacity=".5"/>
      <rect x="${px(r.frac) - 4}" y="${YB - 4}" width="8" height="8" fill="#14b8a6" transform="rotate(45 ${px(r.frac)} ${YB})"/>

/* ── playback ───────────────────────────────────────────────────────────── */
let timer = null;
function tick() {
  const c = cur(), s = c.sim;
  ST.frac = Math.min(1, ST.frac + 0.0022 * ST.speed);
  const hit = s.fires.find((f) => Math.abs(f.frac - ST.frac) < 0.0022 * ST.speed);
  if (hit) {
    const idx = c.checkpoints.findIndex((k) => k.at === hit.min);
    if (idx >= 0) { ST.ck = idx; ST.stage = null; ST.item = null; ST.cmpA = null; ST.cmpB = null; }
    stop(); renderCenter(); renderSimOutput(); renderRight(); return;
  }
  if (ST.frac >= 1) stop();
  renderCenter();
}
function play() { if (timer) return; ST.playing = true; timer = setInterval(tick, 40); syncBtns(); }
function stop() { clearInterval(timer); timer = null; ST.playing = false; syncBtns(); }
function syncBtns() {
  $('btnPlay').disabled = ST.playing || ST.frac >= 1;
  $('btnPause').disabled = !ST.playing;
  $('btnStep').disabled = ST.playing || ST.frac >= 1;
}
/** The decision point the proposal output below belongs to. */
function renderDecisionBand() {
  const c = cur(), k = curCk(), ev = k.evidence;
  const stage = ev.bridge;
  $('decisionBand').innerHTML = `
    <span class="t">${LANG === 'ja' ? 'この判断時点の提案' : 'Proposal at this decision point'}</span>
    <span>${esc(T(k.label))}</span>
    ${k.at != null ? `<span class="mono">@ ${k.at}′</span>` : ''}
    ${stage ? `<span class="mono">· ${esc(stage.triggerPurpose)} · ${esc(stage.lifecycleStage)} · ${esc(stage.motionState)}</span>` : ''}
    <span class="hspacer" style="flex:1"></span>
    <span class="tiny">${c.checkpoints.length > 1 ? (LANG === 'ja' ? 'チェックポイントを切り替えると更新されます' : 'switches with the checkpoint above') : ''}</span>`;
}

/** Proposal output — part of the simulation, so it lives in the centre column.
 *  Deliberately NOT called from the tick loop: it would redraw 25×/second and
 *  collapse any expanded contribution table. */
function renderSimOutput() { renderDecisionBand(); renderServiceCard(); renderContentCard(); }

function renderCenter() {
  renderTimeline(); renderCkRail(); renderMap();
  const D = cur().sim.durationMin, m = Math.round(D * ST.frac);
  $('clock').textContent = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  $('lblQuickview').textContent = T(UI.quickview);
  $('lblQuickviewHint').textContent = T(UI.qvHint);
  $('lblSpeed').textContent = T(UI.speed);
  $('lblCheckpoints').textContent = T(UI.checkpoints);
  $('lblMap').textContent = T(UI.map);

/* ═══════════════════════════════════════════════════════════════════════════
   PART 7 — the right column: verdict, causal comparison, proposal output.
   ═══════════════════════════════════════════════════════════════════════════ */
/** Ranked candidates are ALWAYS sorted by their computed score, so the rank
    shown is the rank the arithmetic produces — never a rank typed by hand. */
const rankedSorted = (sv) => sv.ranked.map((r) => ({ ...r, score: sumC(r.factors) })).sort((a, b) => b.score - a.score);
const itemsSorted = (ct) => ct.items.map((i) => ({ ...i, fit: sumC(i.f) })).sort((a, b) => b.fit - a.fit);

function factorBars(factors, opts = {}) {
  const rows = byAbs(factors).slice(0, opts.n || 5);
  const max = Math.max(...factors.map((f) => Math.abs(f.contrib)), 1e-6);
  const total = factors.reduce((a, f) => a + Math.abs(f.contrib), 0) || 1;
  return rows.map((f, i) => {
    const flag = (opts.flag || []).includes(f.id);
    const w = (Math.abs(f.contrib) / max) * 100;
    return `<div class="fbar ${flag ? 'flag' : ''}">
      <span class="nm"><span class="rk ${i < 3 ? 'top' : ''}">${i + 1}</span><code>${esc(f.id)}</code></span>
      <span class="val" style="color:${f.contrib >= 0 ? 'var(--support)' : 'var(--oppose)'}">${f3(f.contrib)} · ${pct(Math.abs(f.contrib) / total)}</span>
      <span class="track"><span class="fill ${f.contrib >= 0 ? 'sup' : 'opp'}" style="left:0;width:${w}%"></span></span>
    </div>`;
  }).join('');
}

function chainTable(factors, stage) {
  const total = factors.reduce((a, f) => a + Math.abs(f.contrib), 0) || 1;
  const head = stage === 'trigger'
    ? [UI.chainRaw, UI.chainNorm, UI.chainSm, UI.chainW, UI.chainC, UI.chainShare]
    : stage === 'content'
      ? [S('e_i', 'e_i'), S('a_i', 'a_i'), S('r_i = e·a', 'r_i = e·a'), UI.chainW, UI.chainC, UI.chainShare]
      : [UI.chainRaw, UI.chainNorm, UI.chainResp, UI.chainW, UI.chainC, UI.chainShare];
  const cells = (f) => stage === 'trigger'
    ? [esc(String(f.raw)), f2(f.ne), f2(f.sm), f.ew.toFixed(3), f3(f.contrib), pct(Math.abs(f.contrib) / total)]
    : stage === 'content'
      ? [f2(f.e), f2(f.a), f.ri.toFixed(3), f.ew.toFixed(3), f3(f.contrib), pct(Math.abs(f.contrib) / total)]
      : [esc(String(f.raw)), f2(f.ne), f2(f.rc), f.ew.toFixed(3), f3(f.contrib), pct(Math.abs(f.contrib) / total)];
  const order = byAbs(factors);
  return `<table class="chain"><tr><th>feature_id</th>${head.map((h) => `<th>${esc(T(h))}</th>`).join('')}</tr>
    ${order.map((f) => `<tr${f.mask === 0 ? ' style="opacity:.5"' : ''}>
      <td title="${esc(FL(f.id))}">${esc(f.id)}${f.mask === 0 ? ' <span style="color:#94a3b8">(masked)</span>' : ''}</td>
      ${cells(f).map((v, i) => `<td class="${i === 4 ? (f.contrib >= 0 ? 'c-sup' : 'c-opp') : ''}">${v}</td>`).join('')}
    </tr>${f.note ? `<tr><td colspan="7" style="color:var(--partial);white-space:normal;font-family:inherit;font-size:1.1em;padding:2px 4px 5px">⚠ ${esc(T(f.note))}</td></tr>` : ''}`).join('')}
  </table>`;
}

/* ═══ Parameter-rationale review ═══════════════════════════════════════════
   The reviewed object is the PARAMETER, not the outcome. Three mechanisms,
   all recomputed from the recorded chain — no algorithm is ever re-run:
     · margin decomposition — which features account for the gap that decided it
     · intent vs effect     — declared share of influence vs realized share
     · flip distance        — how far a purpose_multiplier must move to change it
   ════════════════════════════════════════════════════════════════════════ */
const CAT_LABEL = {
  rest_required: S('休憩推奨', 'Rest recommended'),
  monotony_prevention: S('単調さ回避', 'Monotony prevention'),
};
/* Both trigger categories are scored from the SAME smoothed feature vector
   with different weight profiles, so the runner-up's per-feature contributions
   are derivable from the recorded evidence — no second algorithm run. */
const CAT_W = {
  rest_required: { drowsiness_level: .30, fatigue_level: .18, driving_time: .22, rest_window: .12,
    env_load: .10, driving_anomaly: .10, monotony_level: .06, rest_scarcity: .06, familiar_route: .04, traffic_state: .05 },
  monotony_prevention: { monotony_level: .34, driving_time: .22, familiar_route: .14, env_load: .10,
    drowsiness_level: .08, fatigue_level: .08, rest_window: .02, rest_scarcity: .02, driving_anomaly: .04, traffic_state: .05 },
};
const otherCat = (c) => (c === 'monotony_prevention' ? 'rest_required' : 'monotony_prevention');
const categoryFactors = (rows, cat) =>
  triggerFactors(rows.map((r) => ({ ...r, bw: (CAT_W[cat] || {})[r.id] ?? .04, pm: 1 })));

/** Round a magnitude up to a readable axis bound: 0.40 → 0.50, 0.31 → 0.40. */
function niceMax(v) {
  if (!(v > 0)) return 1;
  const base = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10]) if (m * base > v) return Number((m * base).toPrecision(3));
  return Number((10 * base).toPrecision(3));
}

const valOf = (r, kind) => (kind === 'trigger' ? r.sm : kind === 'content' ? r.e * r.a : r.ne * r.rc);

/** Re-derive a score with one feature's purpose_multiplier scaled by `mult`.
 *  Effective weights are renormalised, exactly as the algorithm does. */
function rescore(rows, kind, id, mult) {
  const mod = rows.map((r) => (r.id === id ? { ...r, pm: (r.pm ?? 1) * mult } : r));
  const w = normWeights(mod);
  return mod.reduce((a, r, i) => a + valOf(r, kind) * w[i], 0);
}
/** Score with the feature removed entirely (its weight redistributed). */
const scoreWithout = (rows, kind, id) => rescore(rows, kind, id, 0);

/** Smallest purpose_multiplier factor at which the decision changes, or null
 *  if it never changes for any factor in [0, 5]. Bisection over the chain. */
function flipAt(A, B, kind, threshold, id) {
  const g = (m) => (B ? rescore(A, kind, id, m) - rescore(B, kind, id, m) : rescore(A, kind, id, m) - threshold);
  const s0 = Math.sign(g(1));
  if (s0 === 0) return null;
  let bracket = null, prevM = 0;
  if (Math.sign(g(0)) !== s0) bracket = [0, 1];
  else for (let m = 0.05; m <= 5.0001; m += 0.05) {
    if (Math.sign(g(m)) !== s0) { bracket = [prevM, m]; break; }
    prevM = m;
  }
  if (!bracket) return null;
  let [lo, hi] = bracket;
  for (let i = 0; i < 44; i++) { const mid = (lo + hi) / 2; if (Math.sign(g(mid)) === s0) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}

/** The decision under review, as a LIST of comparable options plus the two
 *  currently being compared (left / right). Default is 1st vs 2nd. */
function reviewTarget() {
  const ev = curCk().evidence, stage = ST.stage;
  let kind = null, options = [], threshold = null;

  if (stage === 'trigger' && ev.trigger && ev.trigger.factors) {
    const t = ev.trigger;
    kind = 'trigger'; threshold = t.threshold;
    const selId = t.category || 'rest_required', othId = otherCat(selId);
    options = [
      { id: selId, label: T(CAT_LABEL[selId] || S(selId, selId)), f: t.factors, score: sumC(t.factors) },
      { id: othId, label: T(CAT_LABEL[othId] || S(othId, othId)), f: categoryFactors(t.factors, othId), score: sumC(categoryFactors(t.factors, othId)) },
    ];
  } else if (stage === 'service' && ev.service) {
    kind = 'service';
    options = rankedSorted(ev.service).map((r) => ({ id: r.id, label: SL(r.id), f: r.factors, score: r.score }));
  } else if (stage === 'content' && ev.content) {
    kind = 'content';
    options = itemsSorted(ev.content).map((x, i) => ({ id: x.trk, label: `#${i + 1} ${TRK[x.trk][0]}`, f: x.f, score: x.fit }));
  }
  if (!kind || options.length === 0) return null;

  // Selection: an explicitly clicked content item wins; otherwise 1st vs 2nd.
  const find = (id, dflt) => { const i = options.findIndex((o) => o.id === id); return i < 0 ? dflt : i; };
  const ai = find(kind === 'content' && ST.item ? ST.item : ST.cmpA, 0);
  let bi = find(ST.cmpB, 1 < options.length ? 1 : 0);
  if (bi === ai) bi = options.findIndex((_, i) => i !== ai);
  const A = options[ai], B = bi >= 0 ? options[bi] : null;

  const trig = kind === 'trigger';
  return {
    kind, options, ai, bi, threshold,
    A: A.f, B: B ? B.f : null,
    idA: A.id, idB: B && B.id, labelA: A.label, labelB: B ? B.label : '—',
    scoreA: A.score, scoreB: B ? B.score : null,
    position: kind === 'content' ? ai + 1 : null, ofN: kind === 'content' ? options.length : null,
    clearance: trig ? A.score - threshold : null,
    margin: B ? A.score - B.score : null,
    marginText: trig ? S('もう一方のカテゴリとの差', 'gap to the other category')
      : kind === 'content' ? S('比較対象との差', 'gap to the compared item')
      : S('比較対象との差', 'gap to the compared option'),
    gates: trig ? (ev.trigger.gates || []) : (ev.service && stage === 'service' ? ev.service.gates || [] : []),
    alts: [], excluded: [],
  };
}

function stageAvailable(stage) {
  const ev = curCk().evidence;
  return stage === 'trigger' ? !!(ev.trigger && ev.trigger.factors) : !!ev[stage];
}

/* ── human judgment store (prototype: in-memory) ─────────────────────────── */
const JUDG = {};
const jkey = (target, f) => `${ST.caseId}|${curCk().id}|${ST.stage}|${target}|${f}`;
const JOPTS = [
  ['rational', S('納得できる', 'Makes sense')],
  ['too_strong', S('効きすぎている', 'Too strong')],
  ['too_weak', S('弱すぎる', 'Too weak')],
  ['not_here', S('この状況では無関係', 'Not relevant here')],
  ['unsure', S('判断できない', 'Not sure')],
];
/** Only a criticism counts as a flag — "makes sense" and "not sure" do not. */
const isFlag = (v) => !!v && v !== 'rational' && v !== 'unsure';

function renderReviewHeader() {
  const c = cur(), tg = reviewTarget();
  const tab = (st, lab) => `<button data-rstage="${st}" class="${ST.stage === st ? 'on' : ''}"
    ${stageAvailable(st) ? '' : 'disabled'}>${esc(T(lab))}</button>`;
  $('reviewHeader').innerHTML = `
  <div class="card">
    <div class="card-h">${esc(T(UI.review))}<span class="hspacer"></span>
      <span class="sub">${esc(T(curCk().label))}</span></div>
    <div class="stage-tabs">${tab('trigger', STAGE_LABEL.trigger)}${tab('service', STAGE_LABEL.service)}${tab('content', STAGE_LABEL.content)}</div>
    ${tg ? `
      <div class="headline">${tg.position ? `<span class="mono" style="color:var(--ink-3)">#${tg.position}/${tg.ofN}</span> ` : ''}${esc(tg.labelA)}</div>
      <div class="margin-line">${esc(T(UI.baselineOut))} · <span class="mono">score ${tg.scoreA.toFixed(3)}</span>
        ${tg.margin != null ? ` · ${esc(T(tg.marginText))} <b>${f3(tg.margin)}</b> ${LANG === 'ja' ? '対' : 'vs'} ${esc(tg.labelB)}` : ''}</div>
      <p class="tiny">${esc(T(UI.baselineNote))} — <span class="mono">${esc(
        ST.stage === 'trigger' ? SETUP.trigger : ST.stage === 'service' ? SETUP.service : SETUP.content)}</span></p>`
      : `<p class="tiny">${esc(T(UI.noStage))}</p>`}
  </div>`;
  document.querySelectorAll('[data-rstage]').forEach((b) => (b.onclick = () => {
    if (b.disabled) return; ST.stage = b.dataset.rstage; ST.cmpA = null; ST.cmpB = null; renderContentCard(); renderRight();
  }));
}

/** WHAT DECIDED IT — a side-by-side comparison of two options, parameter by
 *  parameter, on one shared scale. No aggregate bar: the reviewer compares the
 *  two columns directly and sees which side each input pulls toward. */
function renderMargin() {
  const tg = reviewTarget();
  if (!tg) { $('marginCard').innerHTML = ''; return; }
  if (!tg.B) {
    $('marginCard').innerHTML = `<div class="card"><div class="card-h">${esc(T(UI.whatDecided))}</div>
      <p class="tiny">${esc(T(UI.noAlt))}</p></div>`;
    return;
  }
  const rows = tg.A.map((f, i) => ({ id: f.id, f, a: f.contrib, b: tg.B[i].contrib, d: f.contrib - tg.B[i].contrib }))
    .sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
  // One shared scale across BOTH columns, rounded up to a readable bound.
  const bound = niceMax(Math.max(...rows.flatMap((r) => [Math.abs(r.a), Math.abs(r.b)]), 1e-6));

  // ── verdict sentence ───────────────────────────────────────────────────
  const pos = rows.filter((r) => r.d > 1e-6), neg = rows.filter((r) => r.d < -1e-6);
  const p1 = pos[0] && PH(pos[0].id), n1 = neg[0] && PH(neg[0].id);
  const behind = tg.margin < 0;
  const verdict = tg.kind === 'trigger'
    ? T(UI.sentFired).replace('{p}', p1 || '—')
    : behind ? T(UI.sentBehind).replace('{n}', n1 || '—').replace('{b}', tg.labelB)
      : T(UI.sentWon).replace('{a}', tg.labelA).replace('{p}', p1 || '—') + (n1 ? T(UI.sentDespite).replace('{n}', n1) : '');

  // ── option pickers ─────────────────────────────────────────────────────
  const picker = (side, sel) => `<select class="cmpsel" data-side="${side}">
    ${tg.options.map((o, i) => `<option value="${o.id}"${i === sel ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;

  // ── one bar pair per parameter, mirrored from the centre ───────────────
  const pair = (av, bv) => `
    <span class="cv l">${f3(av)}</span>
    <span class="cbar l"><span style="width:${Math.min(100, (Math.abs(av) / bound) * 100)}%;background:${av >= 0 ? 'var(--support)' : 'var(--oppose)'}"></span></span>
    <span class="cmid"></span>
    <span class="cbar r"><span style="width:${Math.min(100, (Math.abs(bv) / bound) * 100)}%;background:${bv >= 0 ? 'var(--support)' : 'var(--oppose)'}"></span></span>
    <span class="cv r">${f3(bv)}</span>`;

  const detail = rows.map((r) => {
    const rv = rawOf(r.f, tg.kind), g = groupOf(r.id);
    return `<div class="cmprow">
      <div class="clabel"><span class="gdot" style="background:${g[2]}"></span><b>${esc(PH(r.id))}</b>
        <span class="anchor">${esc(rv.txt)}${rv.showBand ? ` · ${esc(T(rv.band))}` : ''}</span>
        <span class="lean ${r.d >= 0 ? 'l' : 'r'}">${r.d >= 0 ? '◀' : '▶'} ${f3(Math.abs(r.d))}</span></div>
      <div class="cbars">${pair(r.a, r.b)}</div>
    </div>`;
  }).join('');

  // ── domain balance, both sides ─────────────────────────────────────────
  const gA = {}, gB = {};
  for (const r of rows) { const k = groupOf(r.id)[0]; gA[k] = (gA[k] || 0) + Math.abs(r.a); gB[k] = (gB[k] || 0) + Math.abs(r.b); }
  const tA = Object.values(gA).reduce((x, y) => x + y, 0) || 1, tB = Object.values(gB).reduce((x, y) => x + y, 0) || 1;
  const balance = GROUPS.filter((g) => (gA[g[0]] || 0) + (gB[g[0]] || 0) > 1e-9).map((g) => `
    <div class="cmprow"><div class="clabel"><span class="gdot" style="background:${g[2]}"></span>${esc(T(g[1]))}</div>
      <div class="cbars">
        <span class="cv l">${pct(gA[g[0]] / tA)}</span>
        <span class="cbar l"><span style="width:${(gA[g[0]] / tA) * 100}%;background:${g[2]}"></span></span>
        <span class="cmid"></span>
        <span class="cbar r"><span style="width:${(gB[g[0]] / tB) * 100}%;background:${g[2]}"></span></span>
        <span class="cv r">${pct(gB[g[0]] / tB)}</span></div></div>`).join('');

  $('marginCard').innerHTML = `
  <div class="card">
    <div class="card-h">${esc(T(UI.whatDecided))}<span class="hspacer"></span>
      <span class="sub mono">${esc(T(UI.scale))} ±${bound}</span></div>
    <p class="verdict">${esc(verdict)}</p>
    <div class="cmphead">
      <div class="side l">${picker('a', tg.ai)}<span class="sc mono">${tg.scoreA.toFixed(3)}</span></div>
      <div class="vs">vs</div>
      <div class="side r">${picker('b', tg.bi)}<span class="sc mono">${tg.scoreB.toFixed(3)}</span></div>
    </div>
    ${tg.kind === 'trigger' ? `<p class="tiny" style="text-align:center;margin-bottom:6px">
      ${esc(T(UI.threshLine))} ${tg.threshold} · ${esc(T(UI.clearance))} <b class="mono">${f3(tg.clearance)}</b></p>` : ''}
    <div class="sec-l">${esc(T(UI.balance))}</div>${balance}
    <div class="sec-l">${esc(T(UI.perInput))}</div>
    <p class="tiny" style="margin-bottom:6px">${esc(T(UI.cmpNote))}</p>
    ${detail}
  </div>`;
  document.querySelectorAll('.cmpsel').forEach((n) => (n.onchange = (e) => {
    if (n.dataset.side === 'a') { ST.cmpA = e.target.value; if (tg.kind === 'content') ST.item = e.target.value; }
    else ST.cmpB = e.target.value;
    if (tg.kind === 'content') renderContentCard();
    renderRight();
  }));
}

/** PARAMETER RATIONALE — intent vs effect, necessity, flip distance, and the
 *  plain-language consequence of each, plus what played no part at all. */
function renderRationale() {
  const tg = reviewTarget();
  if (!tg) { $('rationaleCard').innerHTML = ''; return; }
  const total = tg.A.reduce((a, f) => a + Math.abs(f.contrib), 0) || 1;
  const rows = tg.A.map((f) => {
    const declared = f.ew, realized = Math.abs(f.contrib) / total;
    const without = scoreWithout(tg.A, tg.kind, f.id);
    const flip = flipAt(tg.A, tg.kind === 'trigger' ? null : tg.B, tg.kind, tg.threshold, f.id);
    const necessary = tg.kind === 'trigger' ? without < tg.threshold
      : tg.B ? (without - scoreWithout(tg.B, tg.kind, f.id) <= 0) : false;
    return { f, declared, realized, without, flip, necessary, ratio: declared > 1e-9 ? realized / declared : 0 };
  }).sort((a, b) => b.realized - a.realized);

  const tgt = tg.idA || 'selected_category';
  const gapCls = (r) => (r.ratio > 1.6 ? 'over' : r.ratio < 0.4 ? 'under' : 'ok');
  const gapTxt = (r) => (r.ratio > 1.6 ? '↑' : r.ratio < 0.4 ? '↓' : '≈');
  const other = tg.kind === 'trigger' ? T(UI.noFire) : tg.labelB;

  // ── consequences, stated as outcomes (idea 3) ──────────────────────────
  const cons = [];
  for (const r of rows) {
    if (r.necessary) cons.push({ cls: 'warn', t: T(UI.cfNecessary).replace('{p}', PH(r.f.id)).replace('{b}', other) });
    else if (r.flip != null && r.flip > .4 && r.flip < 2.5) {
      const pctChange = r.flip > 1 ? Math.round((r.flip - 1) * 100) : Math.round((1 - r.flip) * 100);
      cons.push({ cls: 'soft', t: T(r.flip > 1 ? UI.cfStronger : UI.cfWeaker)
        .replace('{p}', PH(r.f.id)).replace('{x}', pctChange).replace('{b}', other) });
    }
  }
  // ── what played no part (idea 5) ───────────────────────────────────────
  const inert = rows.filter((r) => r.realized < .02);

  $('rationaleCard').innerHTML = `
  <div class="card">
    <div class="card-h">${esc(T(UI.rationale))}</div>
    <p class="tiny" style="margin-bottom:6px">${esc(T(UI.rationaleNote))}</p>
    <table class="rat">
      <tr><th>${esc(T(UI.input))}</th><th title="${esc(T(UI.hSituation2))}">${esc(T(UI.situation))}</th>
        <th title="${esc(T(UI.hDeclared))}">${esc(T(UI.declared))}</th>
        <th title="${esc(T(UI.hRealized))}">${esc(T(UI.realized))}</th><th></th>
        <th>${esc(T(UI.yourView))}</th></tr>
      ${rows.map((r) => {
        const j = JUDG[jkey(tgt, r.f.id)], rv = rawOf(r.f, tg.kind), g = groupOf(r.f.id);
        return `<tr class="${j ? 'j-' + j : ''}">
          <td title="${esc(r.f.id)}"><span class="gdot" style="background:${g[2]}"></span>${esc(PH(r.f.id))}</td>
          <td class="anchor-c">${esc(rv.txt)}${rv.showBand ? `<br><span class="bandw">${esc(T(rv.band))}</span>` : ''}</td>
          <td>${pct(r.declared)}</td>
          <td>${pct(r.realized)}</td>
          <td class="gap ${gapCls(r)}">${gapTxt(r)}</td>
          <td class="jcell"><select data-j="${r.f.id}" class="jsel ${j ? 'set j-' + j : ''}">
            <option value="">${esc(T(UI.jNone))}</option>
            ${JOPTS.map(([v, lab]) => `<option value="${v}"${j === v ? ' selected' : ''}>${esc(T(lab))}</option>`).join('')}
          </select></td>
        </tr>`;
      }).join('')}
    </table>
    <p class="tiny" style="margin-top:6px">${esc(T(UI.legendRat))}</p>
    ${tg.kind !== 'trigger' && cons.length ? `<div class="sec-l">${esc(T(UI.consequences))}</div>
      ${cons.map((c) => `<p class="cons ${c.cls}">${esc(c.t)}</p>`).join('')}` : ''}
    ${tg.kind !== 'trigger' && inert.length ? `<div class="sec-l">${esc(T(UI.playedNoPart))}</div>
      <p class="inert">${inert.map((r) => esc(PH(r.f.id))).join(' · ')}</p>
      <p class="tiny">${esc(T(UI.playedNoPartNote))}</p>` : ''}
  </div>`;
  document.querySelectorAll('[data-j]').forEach((n) => (n.onchange = (e) => {
    const k = jkey(tgt, n.dataset.j);
    if (e.target.value) JUDG[k] = e.target.value; else delete JUDG[k];
    renderRationale(); renderFeedback(); renderCkRail(); renderCaseCard();
  }));
}

/* ── customer feedback ───────────────────────────────────────────────────
   Two levels: a verdict on the decision itself, and the per-input judgments
   above. Everything is keyed to (case · decision point · stage · target) and
   exportable, so it comes back to the team as evidence, not as a conversation. */
const FB = {};
function renderFeedback() {
  const tg = reviewTarget();
  if (!tg) { $('feedbackCard').innerHTML = ''; return; }
  const tgt = tg.idA || 'selected_category';
  const key = `${ST.caseId}|${curCk().id}|${ST.stage}|${tgt}`;
  const cur_ = FB[key] || {};
  // Everything the reviewer said about the individual inputs, gathered up.
  const mine = tg.A.map((f) => ({ id: f.id, v: JUDG[jkey(tgt, f.id)] })).filter((x) => x.v);
  const pending = tg.A.length - mine.length;
  const total = Object.keys(JUDG).length + Object.values(FB).filter((f) => f.v || f.c).length;

  $('feedbackCard').innerHTML = `
  <div class="card">
    <div class="card-h">${esc(T(UI.feedback))}</div>
    <div class="sec-l" style="margin-top:0">${esc(T(UI.yourNotes))}</div>
    ${mine.length ? `<div class="notes">${mine.map((x) => {
        const o = JOPTS.find((j) => j[0] === x.v);
        return `<div class="note-row j-${x.v}">
          <span class="np">${esc(PH(x.id))}</span><span class="nv">${esc(T(o[1]))}</span></div>`;
      }).join('')}</div>`
      : `<p class="tiny">${esc(T(UI.noNotes))}</p>`}
    <p class="tiny" style="margin:4px 0 9px">${mine.length}/${tg.A.length} ${esc(T(UI.inputsJudged))}${pending ? ` · ${pending} ${esc(T(UI.stillOpen))}` : ''}</p>

    <p class="qline">${esc(T(UI.fbQ))}</p>
    <div class="fbtns">
      ${[['good', '◎', UI.fbGood], ['unsure', '△', UI.fbUnsure], ['bad', '✕', UI.fbBad]].map(([v, ic, lab]) =>
        `<button data-fb="${v}" class="${cur_.v === v ? 'on ' + v : ''}">${ic} ${esc(T(lab))}</button>`).join('')}
    </div>
    <textarea id="fbNote" placeholder="${esc(T(UI.fbPlaceholder))}">${esc(cur_.c || '')}</textarea>
    <div style="display:flex;align-items:center;gap:8px;margin-top:7px">
      <button class="btn" id="btnExport">${esc(T(UI.fbExport))}</button>
      <span class="tiny">${total ? `${total} ${esc(T(UI.fbSaved))}` : esc(T(UI.fbEmpty))}</span>
    </div>
  </div>`;
  document.querySelectorAll('[data-fb]').forEach((b) => (b.onclick = () => {
    FB[key] = { ...(FB[key] || {}), v: (FB[key] || {}).v === b.dataset.fb ? null : b.dataset.fb };
    renderFeedback();
  }));
  $('fbNote').onchange = (e) => { FB[key] = { ...(FB[key] || {}), c: e.target.value }; renderFeedback(); };
  $('btnExport').onclick = exportFeedback;
}

function exportFeedback() {
  const payload = {
    schema_version: '1.0.0',
    exported_for: cur().id,
    packages: { trigger: SETUP.trigger, service: SETUP.service, content: SETUP.content },
    setup_modified: !!SETUP.modified,
    decision_assessments: Object.entries(FB).filter(([, v]) => v && (v.v || v.c)).map(([k, v]) => {
      const [caseId, checkpoint, stage, target] = k.split('|');
      return { case_id: caseId, checkpoint, stage, target, assessment: v.v || null, comment: v.c || null };
    }),
    input_judgments: Object.entries(JUDG).filter(([, v]) => v).map(([k, v]) => {
      const [caseId, checkpoint, stage, target, feature] = k.split('|');
      return { case_id: caseId, checkpoint, stage, target, feature_id: feature, judgment: v };
    }),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `aica-review-${cur().id}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

    ${sec.ladder ? `<div class="fladder"><div class="tiny">${esc(sec.ladder.score)} ${esc(T(UI.isComparedTo))}</div>
      ${sec.ladder.steps.map(([lab, key, mean]) => `<div class="lrow">
        <span class="llab">${esc(lab)}</span>${coefChip(key)}
        <span class="lmean">${esc(T(mean))}</span></div>`).join('')}</div>` : ''}
    ${(sec.steps || []).map((st) => `<div class="fstep">
      <p>${esc(T(st.text))}</p>
      ${st.eq ? `<div class="feqn mono">${esc(st.eq)}</div>` : ''}
      ${(st.coefs || []).map(coefChip).join('')}
      ${(st.checks || []).map(([op1, op, key, out]) => `<div class="fcheck">

/** hyperparameter sub-slab: kind badge + key + label (ServiceSetupSection). */
const hpk = (kind, key, label, extra) => `<div class="hpk">

/** ScalarTable.tsx — 2 columns, label + faint key, 76px input. */
const scalarTable = (fields, ph, vh) => `<table class="mtx"><thead><tr>
  <th class="corner">${esc(ph || 'parameter')}</th><th>${esc(vh || 'value')}</th></tr></thead><tbody>

  </tr>`).join('')}</tbody></table>`;

/** ResponseMatrixTable.tsx — services across the top, features down the side. */
function responseMatrix(profiles, cornerLabel) {
  const services = Object.keys(profiles);
  const rows = [...new Set(services.flatMap((sv) => Object.keys(profiles[sv] || {})))];
  return `<div style="overflow-x:auto"><table class="mtx"><thead><tr>
    <th class="corner">${esc(cornerLabel)}</th>${services.map((sv) => `<th>${esc(sv)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map((r) => `<tr><th class="rowlab">${esc(r)}</th>
      ${services.map((sv) => { const c = (profiles[sv] || {})[r];
        return `<td${c && c.prov ? ` title="${esc(c.prov)}"` : ''}>${c ? `<input value="${c.coefficient}">` : ''}</td>`; }).join('')}
    </tr>`).join('')}</tbody></table></div>`;
}

/** HierarchyWeightsTable.tsx — category | share | subgroup | share | leaf | share, with rowspans. */
function hierarchyTable(tree) {
  const rows = [];
  for (const [cat, c] of Object.entries(tree)) {
    const subs = Object.entries(c.subgroups);
    const catSpan = subs.reduce((a, [, g]) => a + Math.max(1, Object.keys(g.leaves).length), 0);
    let firstOfCat = true;
    for (const [sg, g] of subs) {
      const leaves = Object.entries(g.leaves);
      let firstOfSub = true;
      for (const [lf, v] of leaves) {
        rows.push(`<tr>
          ${firstOfCat ? `<th class="rowlab" rowspan="${catSpan}">${esc(cat)}</th>
            <td rowspan="${catSpan}"><input value="${c.share}"></td>` : ''}
          ${firstOfSub ? `<th class="rowlab" rowspan="${leaves.length}">${esc(sg)}</th>
            <td rowspan="${leaves.length}"><input value="${g.share}"></td>` : ''}
          <th class="rowlab">${esc(lf)}</th><td><input value="${v}"></td></tr>`);
        firstOfCat = false; firstOfSub = false;
      }
    }
  }
  return `<div style="overflow-x:auto"><table class="mtx"><thead><tr>
    <th>${LANG === 'ja' ? 'カテゴリ' : 'category'}</th><th>${LANG === 'ja' ? '割合' : 'share'}</th>
    <th>${LANG === 'ja' ? 'サブグループ' : 'subgroup'}</th><th>${LANG === 'ja' ? '割合' : 'share'}</th>
    <th>${LANG === 'ja' ? 'リーフ' : 'leaf'}</th><th>${LANG === 'ja' ? '割合' : 'share'}</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>`;
}

/** HyperparamMatrix generic renderer — a plain 2-D table for map/table kinds. */
function matrixTable(obj, cornerLabel) {
  const cols = [...new Set(Object.values(obj).flatMap((r) => Object.keys(r)))];
  return `<div style="overflow-x:auto"><table class="mtx"><thead><tr>
    <th class="corner">${esc(cornerLabel)}</th>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${Object.entries(obj).map(([r, row]) => `<tr><th class="rowlab">${esc(r)}</th>
      ${cols.map((c) => `<td>${row[c] != null ? `<input value="${row[c]}">` : '·'}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}

/** signalPrimitives.tsx — SignalGroup + SignalRow. */
const sgroup = (title, caption, body) => `<div class="sgroup">
  ${title ? `<h3>${esc(title)}</h3>` : ''}${caption ? `<p class="caption">${esc(caption)}</p>` : ''}${body}</div>`;
const srow = (label, value, ctrl, muted) => `<div class="srow${muted ? ' muted' : ''}">
  <span>${esc(label)}</span><span class="sval"><span>${esc(value)}</span>${ctrl || ''}</span></div>`;
const sToggle = (on) => `<input type="checkbox"${on ? ' checked' : ''}>`;
const sNum = (v, mn, mx, st) => `<input type="number" value="${v}" min="${mn}" max="${mx}" step="${st || 1}">`;
const sRange = (v, mn, mx, st) => `<input type="range" value="${v}" min="${mn}" max="${mx}" step="${st || 1}">`;

$('veil').onclick = (e) => { if (e.target === $('veil')) $('veil').classList.remove('open'); };

$('langEn').onclick = () => { LANG = 'en'; document.documentElement.lang = 'en'; $('langEn').classList.add('on'); $('langJa').classList.remove('on'); renderAll(); };

ST.stage = 'service';
renderAll();
</script>
