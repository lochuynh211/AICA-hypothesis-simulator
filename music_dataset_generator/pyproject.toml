[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-dataset-generator"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx",
    "aica-api",
]

[project.scripts]
mdg = "mdg.cli:main"

[tool.uv.sources]
aica-api = { path = "../app/api", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["mdg"]
