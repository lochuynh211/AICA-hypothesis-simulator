[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aica-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["aica_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
