services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8137:8137"
    environment:
      # The package code is mounted at /app, so the repo-root default does not
      # apply in-container; point the registries/recorder at the mounted data dirs.
      - AICA_PACKAGES_DIR=/data/packages
      - AICA_SCENARIOS_DIR=/data/scenarios
      - AICA_RUNS_DIR=/data/runs
      - AICA_ROUTES_DIR=/data/routes
      # Combined Simulator merged-run handles (feature 020). Same repo-root-default
      # trap: without this it resolves to "/merged_runs" in-container and Combined
      # runs fail to persist. Mounted writable below so they survive a recreate.
      - AICA_MERGED_RUNS_DIR=/data/merged_runs
      # Proposal simulator (P1-P7) data dirs. The repo-root default resolves to
      # "/" in-container (package is mounted at /app), so these MUST be set
      # explicitly or the proposal registries load nothing (empty dataset/seeds).
      - AICA_PROPOSAL_CONTRACTS_DIR=/data/proposal_contracts
      - AICA_PROPOSAL_DATASET_DIR=/data/proposal_contracts/dataset
      - AICA_PROPOSAL_SEEDS_DIR=/data/proposal_contracts/seeds
      # Preset test-cases (feature 018). Like the other proposal dirs above, the
      # repo-root default resolves to "/proposal_contracts/presets" in-container
      # (which does not exist), so the PresetStore loads NOTHING and every
      # /api/proposal/presets/{id} returns 404. Point it at the mounted dir.
      - AICA_PROPOSAL_PRESETS_DIR=/data/proposal_contracts/presets
      - AICA_PROPOSAL_RUNS_DIR=/data/proposal_runs
      - AICA_PROPOSAL_PROFILES_DIR=/data/proposal_profiles
      - AICA_PROPOSAL_WORLDS_DIR=/data/proposal_worlds
      # LLM rationale (feature 019). Points at the opt-in `ollama` service
      # (started via `--profile llm`). When that service is NOT up, the explain
      # endpoint simply falls back to the deterministic template — safe default.
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      # watchfiles polling for reliable hot-reload over Windows volume mounts
      - WATCHFILES_FORCE_POLLING=true
      # Outbound proxy for Google Maps. EMPTY by default = direct internet
      # (works off-VPN). On the corporate VPN, put the Netskope proxy URL in a
      # local .env (see .env.example) and compose injects it here; off-VPN the
      # vars are unset so these resolve to empty (no proxy).
      - http_proxy=${HTTP_PROXY-}
      - https_proxy=${HTTPS_PROXY-}
      - HTTP_PROXY=${HTTP_PROXY-}
      - HTTPS_PROXY=${HTTPS_PROXY-}
      # `ollama` MUST stay in no_proxy: the local model server is on the compose
      # network, never through the corporate proxy (urllib honors these).
      - no_proxy=${NO_PROXY-localhost,127.0.0.1,api,ollama}
      - NO_PROXY=${NO_PROXY-localhost,127.0.0.1,api,ollama}
    volumes:
      - ./app/api:/app
      - api_venv:/app/.venv
      # Data directories mounted from the repo root so packages/scenarios load
      # and run logs persist back to the host's runs/ directory.
      - ./packages:/data/packages
      - ./scenarios:/data/scenarios
      - ./runs:/data/runs
      - ./routes:/data/routes
      - ./merged_runs:/data/merged_runs
      # Proposal simulator data: frozen contracts (dataset/seeds/matrix/
      # capabilities/built-in profiles) read-only; user runs/profiles/worlds
      # persist back to the host.
      - ./proposal_contracts:/data/proposal_contracts:ro
      - ./proposal_runs:/data/proposal_runs
      - ./proposal_profiles:/data/proposal_profiles
      - ./proposal_worlds:/data/proposal_worlds

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "5180:5180"
    environment:
      - VITE_API_TARGET=http://api:8137
      # Polling for reliable HMR over Windows volume mounts
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./app/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  # Opt-in local LLM server for the backend explanation provider (feature 019).
  # NOT started by a plain `docker compose up` — enable with the `llm` profile:
  #   docker compose --profile llm up
  # One-time model pull (after it's running):
  #   docker compose --profile llm exec ollama ollama pull qwen2.5:3b
  # The `api` service reaches it at http://ollama:11434 (see OLLAMA_BASE_URL).
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    restart: unless-stopped
    # Ollama's OUTBOUND model pull (`ollama pull qwen2.5:3b`) reaches
    # registry.ollama.ai. EMPTY proxy by default = direct (off-VPN). On the VPN,
    # set HTTP_PROXY/HTTPS_PROXY in .env; off-VPN they resolve to empty.
    environment:
      - http_proxy=${HTTP_PROXY-}
      - https_proxy=${HTTPS_PROXY-}
      - HTTP_PROXY=${HTTP_PROXY-}
      - HTTPS_PROXY=${HTTPS_PROXY-}
      - no_proxy=${NO_PROXY-localhost,127.0.0.1}
      - NO_PROXY=${NO_PROXY-localhost,127.0.0.1}
    # `api` reaches Ollama over the compose network (http://ollama:11434); the
    # host mapping is bound to loopback only (for one-off host-side pulls/debug),
    # never exposed on all interfaces — the API is unauthenticated.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  api_venv:
  frontend_node_modules:
  ollama_models:
